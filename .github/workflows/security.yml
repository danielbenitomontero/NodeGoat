name: Security Pipeline

on: [push]

jobs:
  sast:
    name: 1. SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep && semgrep --config=auto --json --output=semgrep-report.json . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  secrets:
    name: 2. Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  sca:
    name: 3. SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'nodegoat'
          path: '.'
          format: 'HTML'
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: 'reports/dependency-check-report.html'

  docker-scan:
    name: 4. Docker Image Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nodegoat:local .
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'nodegoat:local'
          format: 'table'

  dast:
    name: 5. DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d && sleep 25
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4000'
          fail_action: false